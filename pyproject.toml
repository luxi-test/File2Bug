[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fail2bug"
version = "0.1.0"
description = "从飞书执行表筛选失败用例，审核后批量提 Bug"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1.5,<4",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.18,<1",
  "openpyxl>=3.1,<4",
  "pillow>=10.4,<13",
]

[project.optional-dependencies]
# SDK 的 protobuf 命名空间目前仍使用 pkg_resources。
bot = ["lark-oapi>=1.4,<2", "setuptools>=75,<81"]
dev = ["pytest>=8,<10"]

[project.scripts]
f2b = "fail2bug.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fail2bug = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
